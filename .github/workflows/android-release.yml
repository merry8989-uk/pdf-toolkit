name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version name to build, e.g. 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="${{ inputs.version }}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "Building version $NAME (code ${{ github.run_number }})"

      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing — refusing to build an unsigned release."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ks/release.p12"
          ls -l "$RUNNER_TEMP/ks"

      - name: Check the keystore can be read
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore "$RUNNER_TEMP/ks/release.p12" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" | grep -E "Alias name|Entry type|Valid from|SHA256" || {
              echo "::error::The keystore could not be read with the configured alias."
              keytool -list -keystore "$RUNNER_TEMP/ks/release.p12" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" || true
              exit 1
            }

      - name: Stage the web app into assets
        run: |
          mkdir -p "$RUNNER_TEMP/www"
          rsync -a \
            --exclude 'android' --exclude '.git' --exclude '.github' \
            --exclude '*.zip' --exclude 'README.md' --exclude 'LICENSE' \
            ./ "$RUNNER_TEMP/www/"
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          mv "$RUNNER_TEMP/www" android/app/src/main/assets/www
          echo "assets staged:"
          du -sh android/app/src/main/assets/www
          ls android/app/src/main/assets/www | head -20

      - name: Build the signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/ks/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.v.outputs.name }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          cd android
          gradle assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is signed
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "::error::No APK was produced."; exit 1; fi
          echo "APK: $APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
          echo "--- contents ---"
          unzip -l "$APK" | grep -E 'classes.dex|AndroidManifest|assets/www/index.html' | head -5
          echo "--- size ---"
          du -h "$APK"

      - name: Name the artifact
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          OUT="pdf-toolkit-${{ steps.v.outputs.name }}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: pdf-toolkit-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.name }}
          name: PDF Toolkit ${{ steps.v.outputs.name }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            PDF Toolkit for Android — ${{ steps.v.outputs.name }}

            Every one of the 102 PDF and photo tools, running entirely on your device.
            The app bundles its own copy of the site, so it works with no connection
            and nothing is ever uploaded.

            - Package: `io.osintgram.pdftoolkit`
            - Version: `${{ steps.v.outputs.name }}` (code ${{ steps.v.outputs.code }})
            - Signed with the permanent release key, so this installs as an update
              over any earlier version.

            Install: download the APK below and open it. Android will ask you to
            allow installing from this source the first time.
          fail_on_unmatched_files: true
