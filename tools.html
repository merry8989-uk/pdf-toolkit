<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>All PDF &amp; image tools — PDF Toolkit</title>
<meta name="description" content="The complete list of browser-based tools: merge, split, compress, organise, rotate, crop, watermark, page numbers, sign, redact, OCR, convert, protect and photo tools.">
<link rel="canonical" href="https://merry8989-uk.github.io/pdf-toolkit/tools.html">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0d1320">
<link rel="icon" href="./logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <div class="tool-head">
    <h1>All tools</h1>
    <p class="lead"><span id="toolcount">102</span> tools that run entirely in your browser. Pick one — your file stays on your device.</p>
  </div>
  <div class="jump" id="jump"></div>
  <div id="all"></div>
</main>
<script type="module">
  import { siteChrome, REGISTRY, ALL_TOOLS } from "./app.js";
  siteChrome();
  document.getElementById("toolcount").textContent = ALL_TOOLS.length;

  document.getElementById("jump").innerHTML = REGISTRY.flatMap((c) =>
    c.groups.map((g) => `<a href="#g-${c.id}-${g.name.replace(/[^a-z0-9]+/gi, "-").toLowerCase()}">${g.name} (${g.tools.length})</a>`)
  ).join("");

  document.getElementById("all").innerHTML = REGISTRY.map((cat) => `
    <section class="cat" id="cat-${cat.id}">
      <div class="cat-head"><h2>${cat.icon} ${cat.name} tools</h2><p>${cat.tagline}</p></div>
      ${cat.groups.map((g) => `
        <h3 class="grp" id="g-${cat.id}-${g.name.replace(/[^a-z0-9]+/gi, "-").toLowerCase()}">${g.name} <span class="count">${g.tools.length}</span></h3>
        <div class="grid">
          ${g.tools.map((t) => `<a class="card" href="./${t[0]}.html"><div class="t"><span class="ic">${g.icon}</span>${t[1]}</div><div class="d">${t[2]}</div></a>`).join("")}
        </div>`).join("")}
    </section>`).join("");
</script>
</body>
</html>
